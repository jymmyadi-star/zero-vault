name: Maestro E2E

on:
  workflow_dispatch:
  push:
    branches: [main, rebrand-zerovault-to-socler]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'hooks/**'
      - 'components/**'
      - '.maestro/**'
      - '.github/workflows/maestro.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ReactiveCircus/android-emulator-runner provisions the Android SDK,
      # auto-accepts licenses, boots the emulator, and runs the script.
      # (We do the Gradle build inside it so it runs against the provisioned SDK.)
      - name: Build APK, install, and run Maestro on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            echo "::group::Build debug APK"
            cd android
            chmod +x gradlew
            bash gradlew assembleDebug --no-daemon
            cd ..
            echo "::endgroup::"

            echo "::group::Install APK"
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            echo "::endgroup::"

            echo "::group::Install Maestro CLI"
            curl -fsSL "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            echo "::endgroup::"

            echo "::group::Run Maestro flows"
            maestro test .maestro/smoke.yaml .maestro/unlock-relock.yaml
            echo "::endgroup::"

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: ~/.maestro/tests
          if-no-files-found: ignore
